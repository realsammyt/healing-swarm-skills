# Orchestrator Workflow
# Full healing application development lifecycle

name: healing-swarm-workflow
version: 1.0.0
description: |
  Complete orchestration of healing application development from
  research through deployment, coordinating all specialized agents.
  Runs in any coding agent: by default each phase runs inline, in order,
  and hands off to the next through a file in ./healing-output/<run>/.
  Parallel fan-out to subagents is optional and only used when the host
  agent supports it. The handoff files are the contract in both modes.

# ═══════════════════════════════════════════════════════════════════════════════
# EXECUTION
# ═══════════════════════════════════════════════════════════════════════════════

execution:
  default_mode: sequential_inline
  run_dir: ./healing-output/<run>/

  modes:
    sequential_inline:
      description: |
        The conductor plays each phase's roles itself, one phase at a time.
        Each phase reads the previous handoff files and writes its own.
        Needs only the ability to read and write files.
      requires: [read files, write files]

    parallel_subagents:
      description: |
        Optional speed-up. Independent tasks within a phase are handed to
        subagents at the same time (see parallel_phases). Each subagent writes
        its piece to the run directory; the conductor still writes the phase
        handoff file. If subagents fail or aren't available, fall back to
        sequential_inline for that phase.
      requires: [read files, write files, hand a task to a subagent]
      optional: true

  # One handoff file per phase, written last. Its presence means the phase
  # completed. Each opens with a status header (phase, status: complete,
  # blocked, or veto; date; inputs) and ends with a For Next Phase section.
  handoff_sequence:
    - phase: discovery
      writes: brief.md
    - phase: planning
      reads: [brief.md]
      writes: plan.md
    - phase: design
      reads: [brief.md, plan.md]
      writes: design.md
    - phase: content
      reads: [brief.md, plan.md, design.md]
      writes: content.md
    - phase: development
      reads: [design.md, content.md]
      writes: build.md
    - phase: quality
      reads: [content.md, build.md]
      gate_files: reviews/<reviewer>.md
      writes: quality.md
    - phase: remediation
      reads: [quality.md]
      writes: remediation.md
      then: re-run quality
    - phase: deployment
      reads: [quality.md, build.md, content.md]
      writes: deploy.md

  resume:
    rule: Start at the first phase in handoff_sequence whose file is missing.
    blocked: If a handoff file has status blocked, resume that phase.
    veto: |
      If quality.md has status veto, or a reviews/ gate block on a veto gate
      (ethics, accessibility) has status fail or veto, halt. Do not deploy.
      The veto stands until human review or a major revision passes a fresh
      quality run.
    stale_quality: If remediation.md is newer than quality.md, re-run quality.
    partial: |
      Supporting artifacts without a handoff file mean the phase was
      interrupted. Reuse what is sound, finish the gap, then write the file.

# ═══════════════════════════════════════════════════════════════════════════════
# PHASES
# ═══════════════════════════════════════════════════════════════════════════════

phases:
  - id: discovery
    name: Discovery
    description: Research healing modalities and user needs
    workflows:
      - research/workflow.yaml
    agents:
      - traditions-scholar
      - clinical-researcher
      - mechanisms-neuroscientist
    handoff: brief.md
    outputs:
      - brief.md
      - research/ # traditions, clinical evidence, mechanism bridges
    checkpoint: true

  - id: planning
    name: Planning
    description: Create implementation plan
    agent: swarm-conductor
    inputs:
      - brief.md
    handoff: plan.md
    outputs:
      - plan.md # implementation plan, content requirements, milestones
    checkpoint: true

  - id: design
    name: Design
    description: Design user experience and visual system
    workflows:
      - design/workflow.yaml
    agents:
      - ux-architect
      - visual-designer
    inputs:
      - brief.md
      - plan.md
    handoff: design.md
    outputs:
      - design.md # user journeys, wireframes, component specs
      - design-system.json
    checkpoint: true

  - id: content
    name: Content Creation
    description: Create all healing content
    workflows:
      - content/workflow.yaml
    agents:
      - content-writer
    inputs:
      - brief.md
      - plan.md
      - design.md
    handoff: content.md
    outputs:
      - content.md
      - content-library/
      - content-library/prayers/
      - content-library/visualizations/
      - content-library/practices/
      - content-library/evidence-boxes/
      - content-library/journal-prompts/
      - content-manifest.json
    checkpoint: true

  - id: development
    name: Development
    description: Build the application
    workflows:
      - build/workflow.yaml
    agents:
      - app-developer
    inputs:
      - design.md
      - content.md
    handoff: build.md
    outputs:
      - build.md
      - healing-app/
    checkpoint: true

  - id: quality
    name: Quality Assurance
    description: Comprehensive quality review
    workflows:
      - quality/workflow.yaml
    agents:
      - ethics-guardian
      - clinical-reviewer
      - cultural-reviewer
      - accessibility-auditor
      - trauma-informed-reviewer
    inputs:
      - content.md
      - build.md
    handoff: quality.md
    outputs:
      # One file per reviewer, each ending in its fenced JSON gate block:
      # {"gate": "<name>", "status": "pass|fail|veto", "blocking": true, "issues": []}
      - reviews/<reviewer>.md
      - quality.md # written only after every review file exists
    gate: must_pass
    checkpoint: true

  - id: remediation
    name: Remediation
    description: Address quality issues
    condition: quality_issues_found
    agents:
      - content-writer
      - app-developer
    inputs:
      - quality.md
    handoff: remediation.md
    outputs:
      - remediation.md # fixes applied in place to content-library/ and healing-app/
    then: re-run quality
    loop:
      until: all_reviews_pass
      max_iterations: 5

  - id: deployment
    name: Deployment
    description: Deploy application
    workflows:
      - deploy/workflow.yaml
    agents:
      - devops-specialist
      - content-manager
    inputs:
      - quality.md # all gates pass
      - build.md
      - content.md
    handoff: deploy.md
    outputs:
      - deploy.md # staging and production URLs recorded inside
    checkpoint: true

# ═══════════════════════════════════════════════════════════════════════════════
# STATE MANAGEMENT
# ═══════════════════════════════════════════════════════════════════════════════

state:
  # The handoff files are the source of truth. state.json is an optional
  # convenience index; if it disagrees with the files, the files win.
  source_of_truth: handoff_files
  storage: ./healing-output/<run>/state.json

  schema:
    project_id: string
    project_name: string
    current_phase: Phase
    phase_status: { [phase]: Status }
    artifacts: { [name]: path }
    reviews: { [type]: ReviewResult }
    blockers: Blocker[]
    checkpoints: Checkpoint[]

  checkpoint_policy:
    save_after: each_phase # a checkpoint is the phase's written handoff file
    restore_capability: true
    max_checkpoints: 10

# ═══════════════════════════════════════════════════════════════════════════════
# QUALITY GATES
# ═══════════════════════════════════════════════════════════════════════════════

gates:
  discovery_complete:
    checks:
      - research_brief_exists
      - at_least_one_tradition_researched
      - evidence_reviewed
    blocking: true

  design_complete:
    checks:
      - design_system_created
      - user_journeys_defined
      - component_specs_complete
    blocking: true

  content_complete:
    checks:
      - all_required_content_created
      - content_follows_templates
      - initial_review_passed
    blocking: true

  development_complete:
    checks:
      - application_builds
      - core_features_functional
      - accessibility_basics_met
    blocking: true

  quality_approved:
    checks:
      - ethics_guardian_approved
      - clinical_review_passed
      - cultural_review_passed
      - accessibility_audit_passed
      - trauma_informed_review_passed
      - every_review_file_has_gate_block
    gate_files: ./healing-output/<run>/reviews/
    check_command: node scripts/check-gates.js --require=ethics,accessibility ./healing-output/<run>/reviews
    blocking: true
    veto_authority: [ethics-guardian, accessibility-auditor]

  deployment_ready:
    checks:
      - all_quality_gates_passed
      - staging_verified
      - production_configuration_valid
    blocking: true

# ═══════════════════════════════════════════════════════════════════════════════
# PARALLEL EXECUTION (optional, parallel_subagents mode only)
# ═══════════════════════════════════════════════════════════════════════════════

# Used only when the host agent supports subagents. In the default
# sequential_inline mode the same roles run one after another in this order,
# writing the same files.
parallel_phases:
  discovery:
    - traditions-scholar
    - clinical-researcher
    # mechanisms-neuroscientist runs after both complete

  design:
    - ux-architect
    - visual-designer

  quality:
    parallel:
      - clinical-reviewer
      - cultural-reviewer
      - accessibility-auditor
      - trauma-informed-reviewer
    then:
      - ethics-guardian

# ═══════════════════════════════════════════════════════════════════════════════
# ERROR HANDLING
# ═══════════════════════════════════════════════════════════════════════════════

error_handling:
  agent_failure:
    retry: 2
    backoff: exponential
    fallback: run_task_inline # a failed subagent task is redone inline, same files
    on_failure: escalate_to_human

  quality_failure:
    action: enter_remediation_phase
    max_iterations: 5
    on_max: escalate_to_human

  ethics_veto:
    # Veto protocol covers both veto gates: ethics (ethics-guardian) and
    # accessibility (accessibility-auditor).
    action: halt_workflow
    require: human_review_or_major_revision
    cannot_override: true

  crisis_disclosure:
    # Anyone in the loop discloses suicidal thoughts, self-harm, or a
    # medical emergency: stop the phase and follow the crisis protocol.
    action: halt_phase_and_follow_crisis_protocol
    protocol: shared/crisis-response.md
    cannot_override: true

  missing_input:
    action: request_from_source
    timeout: 5_minutes
    on_timeout: escalate

# ═══════════════════════════════════════════════════════════════════════════════
# INVOCATION MODES
# ═══════════════════════════════════════════════════════════════════════════════

modes:
  full:
    description: Complete lifecycle from scratch
    phases: all
    estimated_time: varies_by_scope

  resume:
    description: Continue from the first missing handoff file
    requires: run_dir
    phases: remaining

  phase_only:
    description: Run single phase
    requires: phase_id
    phases: single

  simple:
    description: Minimal viable application
    phases:
      - discovery (quick)
      - design (minimal)
      - content (essential only)
      - development (core features)
      - quality (essential checks)
      - deployment

# ═══════════════════════════════════════════════════════════════════════════════
# PROJECT TEMPLATES
# ═══════════════════════════════════════════════════════════════════════════════

templates:
  healing_journey:
    description: Multi-day healing program
    focus: Sequential practice program
    phases: all
    content:
      - Daily practices
      - Journal prompts
      - Progress tracking
      - Prayer/visualization

  meditation_guide:
    description: Meditation-focused application
    focus: Guided meditation experiences
    phases: all
    content:
      - Meditation scripts
      - Timer functionality
      - Progress tracking

  practice_library:
    description: Reference library of practices
    focus: Browsable practice collection
    phases:
      - discovery
      - design (simple)
      - content
      - development (simple)
      - quality
      - deployment
    content:
      - Practice instructions
      - Evidence boxes
      - Acupoint guides

  content_only:
    description: Static content site
    focus: Educational content
    phases:
      - discovery
      - content
      - quality (content only)
      - deployment (static)

# ═══════════════════════════════════════════════════════════════════════════════
# EXAMPLE INVOCATIONS
# ═══════════════════════════════════════════════════════════════════════════════

examples:
  - name: Full healing journey
    invocation: |
      /healing-swarm "Sacred Healing Journey"
        --focus "ligament healing"
        --traditions "TCM, Jewish mystical"
        --duration "21 days"
    expected:
      - Complete 21-day healing program
      - TCM acupressure practices
      - Jewish healing prayers
      - Full application

  - name: Simple meditation guide
    invocation: |
      /healing-swarm "Breath of Healing"
        --focus "anxiety reduction"
        --simple
    expected:
      - Minimal meditation app
      - Core breathing practices
      - Basic progress tracking

  - name: Resume from checkpoint
    invocation: |
      /healing-swarm --resume
        --run "sacred-healing-journey"
    expected:
      - Finds brief.md and plan.md, no design.md
      - Resume from design phase
      - All prior work preserved

  - name: Content phase only
    invocation: |
      /healing-swarm "Project Name"
        --phase content
        --input ./healing-output/project-name/brief.md
    expected:
      - Content creation only
      - Uses existing research

# ═══════════════════════════════════════════════════════════════════════════════
# OUTPUT
# ═══════════════════════════════════════════════════════════════════════════════

final_output:
  location: ./healing-output/<run>/
  artifacts:
    - brief.md (research documentation)
    - plan.md (implementation plan)
    - design.md and design-system.json (design and tokens)
    - content.md and content-library/ (all healing content)
    - build.md and healing-app/ (application)
    - quality.md and reviews/ (review history with gate blocks)
    - deploy.md (deployment info)

  state:
    - Checkpoint at each phase (the handoff file)
    - Can resume if interrupted
    - Full audit trail

  deliverables:
    - Production URL
    - Documentation
    - Maintenance guide
